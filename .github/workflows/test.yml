name: Test capture
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Nom de la chaîne Twitch
        required: true
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install streamlink
      - name: Capturer 60 images
        run: |
          mkdir frames
          timeout 200 streamlink --stdout "twitch.tv/${{ github.event.inputs.channel }}" best | ffmpeg -i pipe:0 -vf fps=1/3 -frames:v 60 frames/f%02d.jpg || true
      - uses: actions/upload-artifact@v4
        with:
          name: frames
          path: frames
